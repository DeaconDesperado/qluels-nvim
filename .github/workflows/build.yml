name: build
on: 
  pull_request: ~
  push:
    branches:
      - main
  workflow_dispatch:

env:
  QLUELS_VERSION: "v3.11.1"

jobs:
  build:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim_version: ['v0.11.0', 'stable', 'nightly']

    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        uses: nvim-neorocks/nvim-busted-action@v1.1.1
        with:
          nvim_version: ${{ matrix.neovim_version }}

  integration:
    name: qlue-ls protocol smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rhysd/action-setup-vim@v1
        with:
          version: v0.11.0
          neovim: true
      - name: Install qlue-ls ${{ env.QLUELS_VERSION }} 
        run: cargo install --git https://github.com/IoannisNezis/Qlue-ls --tag $QLUELS_VERSION --locked qlue-ls
      - name: Exercise native custom methods
        run: nvim --headless -u NONE --cmd "set rtp+=$PWD" -l spec/integration.lua
